<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title description">
<title id="title">One backing buffer</title>
<desc id="description">A horizontal rocket illustrates caller-owned storage with unused capacity and a FlatBuffer frame containing root and vtable, table, string, and vector. view.fuel is decoded as 80; view.pilot borrows Ziguana bytes. Fins and exhaust are decorative; this is not an exact wire layout.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 22px; }
</style>
<rect width="1280" height="600" rx="14" fill="#0d1117"/>
<defs>
  <pattern id="unused" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M-3 3L3 -3 M0 12L12 0 M9 15L15 9" stroke="#35404b" stroke-width="1"/>
  </pattern>
  <linearGradient id="exhaust" x1="0" x2="1">
    <stop offset="0" stop-color="#ffae92" stop-opacity="0"/>
    <stop offset="0.55" stop-color="#ffae92" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#f9c57d"/>
  </linearGradient>
  <path id="hull" d="M202 176H1080C1148 176 1198 202 1220 224C1198 246 1148 272 1080 272H202Q196 272 196 266V182Q196 176 202 176Z"/>
  <clipPath id="hull-clip"><use href="#hull"/></clipPath>
</defs>
<text x="32" y="48" font-size="24" fill="#f3eee8">ONE BACKING BUFFER</text>
<text x="1248" y="47" font-size="17" fill="#bfc3c8" text-anchor="end">Conceptual layout · not to scale</text>
<text x="708" y="104" font-size="21" fill="#f3eee8" text-anchor="middle">caller-owned storage</text>
<path d="M196 126V114H1220V126 M440 164V152H1220V164" fill="none" stroke="#bfc3c8" stroke-width="1.5"/>
<text x="830" y="143" font-size="20" fill="#f3eee8" text-anchor="middle">FlatBuffer frame</text>
<g aria-hidden="true" stroke-linejoin="round">
  <path d="M158 204C124 201 111 215 72 213L42 224L72 235C111 233 124 247 158 244Z" fill="url(#exhaust)"/>
  <path d="M158 214L113 217L92 224L113 231L158 234Z" fill="#f9c57d"/>
  <path d="M196 176L172 143L270 153L324 176Z M196 272L172 305L270 295L324 272Z" fill="#33241f" stroke="#ffae92" stroke-width="1.5"/>
  <path d="M158 200L196 189V259L158 248Z" fill="#141b23" stroke="#bfc3c8" stroke-width="1.5"/>
  <path d="M170 197V251 M183 193V255" stroke="#35404b" stroke-width="2"/>
</g>
<g clip-path="url(#hull-clip)">
  <rect x="196" y="176" width="1024" height="96" fill="#141b23"/>
  <rect x="196" y="176" width="244" height="96" fill="url(#unused)"/>
  <rect x="440" y="176" width="160" height="96" fill="#2b2223"/>
  <rect x="600" y="176" width="210" height="96" fill="#1c2530"/>
  <rect x="810" y="176" width="200" height="96" fill="#33291c"/>
  <rect x="1010" y="176" width="210" height="96" fill="#282521"/>
  <path d="M440 176V272 M600 176V272 M810 176V272 M1010 176V272" fill="none" stroke="#bfc3c8"/>
  <path d="M440 177H1080C1148 177 1198 203 1220 224" fill="none" stroke="#ffae92" stroke-width="3"/>
</g>
<use href="#hull" fill="none" stroke="#bfc3c8" stroke-width="1.5"/>
<text x="318" y="231" font-size="22" fill="#bfc3c8" text-anchor="middle" font-style="italic">unused capacity</text>
<text x="520" y="215" font-size="22" fill="#f3eee8" text-anchor="middle">root /</text>
<text x="520" y="241" font-size="22" fill="#f3eee8" text-anchor="middle">vtable</text>
<text x="705" y="231" font-size="22" fill="#f3eee8" text-anchor="middle">table</text>
<text x="910" y="231" font-size="22" fill="#f3eee8" text-anchor="middle">string</text>
<text x="1100" y="231" font-size="22" fill="#f3eee8" text-anchor="middle">vector</text>
<path d="M705 272V288H650V305" fill="none" stroke="#ffae92" stroke-width="2"/>
<path d="M910 272V287H1035V305" fill="none" stroke="#f9c57d" stroke-width="2"/>
<circle cx="705" cy="272" r="4" fill="#ffae92"/>
<circle cx="910" cy="272" r="4" fill="#f9c57d"/>
<text x="650" y="327" font-size="22" fill="#ffae92" text-anchor="middle" class="code">view.fuel = 80</text>
<text x="650" y="353" font-size="19" fill="#bfc3c8" text-anchor="middle">decoded scalar</text>
<text x="1035" y="327" font-size="22" fill="#f9c57d" text-anchor="middle" class="code">view.pilot → &quot;Ziguana&quot;</text>
<text x="1035" y="353" font-size="19" fill="#bfc3c8" text-anchor="middle">borrowed bytes</text>
<rect x="32" y="379" width="1216" height="165" rx="8" fill="#141b23" stroke="#35404b"/>
<text class="code" x="55" y="408" fill="#f3eee8" xml:space="preserve"><tspan fill="#ffae92">const</tspan> capacity = <tspan fill="#ffae92">comptime</tspan> flatzz.storage.capacityFor(Rocket.Schema, rocket, .{});</text>
<text class="code" x="55" y="437" fill="#f3eee8" xml:space="preserve"><tspan fill="#ffae92">var</tspan> storage: [capacity]u8 align(flatzz.storage_alignment) = undefined;</text>
<text class="code" x="55" y="466" fill="#f3eee8" xml:space="preserve"><tspan fill="#ffae92">const</tspan> bytes = <tspan fill="#ffae92">try</tspan> rocket.serialize(&amp;storage, .{});</text>
<text class="code" x="55" y="495" fill="#f3eee8" xml:space="preserve"><tspan fill="#ffae92">try</tspan> Rocket.verify(bytes, .{});</text>
<text class="code" x="55" y="524" fill="#f3eee8" xml:space="preserve"><tspan fill="#ffae92">const</tspan> view = <tspan fill="#ffae92">try</tspan> Rocket.read(bytes);</text>
<text x="32" y="577" font-size="19" fill="#bfc3c8" >Fixed-buffer path: no heap allocation. Serialization writes data into storage.</text>
</svg>
